<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight SVG Editor</title>
  <!-- 指定が無いとブラウザが /favicon.ico を取りに行き、毎回 404 がコンソールに出る -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M21 3a13 13 0 1 0 8 23A15 15 0 0 1 21 3z' fill='%23111'/></svg>">
  <style>
    /* 既定の body margin があると全画面キャンバスが横にはみ出す */
    html, body { margin: 0; padding: 0; height: 100%; }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
